version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "deps(go)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: ["*"]
    commit-message:
      prefix: "deps(docker)"

  # ansible-lint and yamllint for the deploy code, pinned with hashes by pip-compile.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      deploy-linters:
        patterns: ["*"]
    commit-message:
      prefix: "deps(pip)"
