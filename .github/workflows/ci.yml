name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy -diff
      - name: Build
        run: go build -mod=readonly -trimpath ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      # Statement coverage across all packages, with a floor. The figure goes into the run summary.
      - name: Coverage
        run: |
          set -euo pipefail
          go test -count=1 -coverpkg=./... -coverprofile=cover.out ./...
          total=$(go tool cover -func=cover.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "statement coverage: ${total} %" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit (t + 0 >= 80.0) ? 0 : 1 }' \
            || { echo "::error::statement coverage ${total} % is below 80 %"; exit 1; }

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "${BASE_SHA}..${HEAD_SHA}"

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  fuzz:
    name: Fuzz (20s per target)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run every fuzz target
        run: |
          set -euo pipefail
          found=0
          for pkg in $(go list ./...); do
            for name in $(go test -list '^Fuzz' "$pkg" | grep -E '^Fuzz' || true); do
              found=$((found + 1))
              echo "::group::$pkg $name"
              go test -run='^$' -fuzz="^${name}\$" -fuzztime=20s "$pkg"
              echo "::endgroup::"
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no fuzz targets found; the fuzz job must not pass vacuously"
            exit 1
          fi
          echo "ran $found fuzz targets"

  vectors:
    name: Test vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check vectors
        run: node spec/tools/check-vectors.mjs

  docker:
    name: Docker build (amd64, arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}

  text-rules:
    name: Text rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check text rules
        run: scripts/check-text.sh

  deploy-lint:
    name: Deploy code (ansible-lint, yamllint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install pinned linters (hash-checked)
        # Regenerate with: pip-compile --generate-hashes --allow-unsafe \
        #   -o .github/deploy-lint-requirements.txt .github/deploy-lint-requirements.in
        run: python -m pip install --require-hashes --no-deps -r .github/deploy-lint-requirements.txt
      - name: yamllint
        run: yamllint -c deploy/.yamllint deploy/
      - name: Playbook syntax
        run: ansible-playbook --syntax-check -i deploy/ansible/inventory.example.yml deploy/ansible/site.yml
      - name: ansible-lint
        working-directory: deploy/ansible
        run: ansible-lint --offline
