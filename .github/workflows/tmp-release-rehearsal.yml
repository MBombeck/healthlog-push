name: Release rehearsal (temporary)

# Temporary: runs the new binaries job of release.yml and the checksum step on this pull request, because
# release.yml itself only runs for a tag. Removed before the merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries and their SBOMs (no signing rights)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REF_NAME: v0.0.0-rehearsal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -mod=readonly -trimpath \
              -ldflags "-s -w -buildid= -X github.com/MBombeck/healthlog-push/internal/buildinfo.Version=${REF_NAME} -X github.com/MBombeck/healthlog-push/internal/buildinfo.Commit=${GITHUB_SHA}" \
              -o "dist/healthlog-push_${REF_NAME}_linux_${arch}" ./cmd/healthlog-push
          done
      - name: SBOM of the amd64 binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/healthlog-push_v0.0.0-rehearsal_linux_amd64
          format: spdx-json
          output-file: dist/healthlog-push_v0.0.0-rehearsal_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the arm64 binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/healthlog-push_v0.0.0-rehearsal_linux_arm64
          format: spdx-json
          output-file: dist/healthlog-push_v0.0.0-rehearsal_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Each SBOM carries the hash of its binary and the modules in it
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bin="healthlog-push_${REF_NAME}_linux_${arch}"
            jq -e --arg sum "$(sha256sum "dist/$bin" | cut -d' ' -f1)" '
              .spdxVersion == "SPDX-2.3"
              and any(.packages[]; .name == "go.etcd.io/bbolt")
              and any(.packages[]; .name == "stdlib")
              and any(.files[]; any(.checksums[]; .checksumValue == $sum))
            ' "dist/$bin.spdx.json" > /dev/null \
              || { echo "::error::dist/$bin.spdx.json does not describe $bin"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Checksums (rehearsal)
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # SHA256SUMS lists the two binaries and their two SBOMs, so the signature on it covers all four.
      - name: Checksums
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 4
          (cd dist && sha256sum healthlog-push_* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Hash release files for the binary provenance
        id: hashes
        run: |
          set -euo pipefail
          echo "hashes=$(cd dist && sha256sum healthlog-push_* SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Show
        run: |
          ls -la dist
          jq -r '.packages[] | .name + " " + (.versionInfo // "")' dist/*_amd64.spdx.json
