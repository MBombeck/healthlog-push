name: Scheduled checks

# Fixes in the Go standard library and new findings in the base image arrive without a commit here, so
# push and pull request runs do not see them. A red run here is the signal for a release.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  image-scan:
    name: Image scan of the published release (Grype, linux/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          # An index is otherwise scanned for the runner's platform only.
          GRYPE_PLATFORM: linux/${{ matrix.arch }}
        with:
          image: ghcr.io/mbombeck/healthlog-push:latest
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
