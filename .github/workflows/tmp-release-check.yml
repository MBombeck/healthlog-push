# Temporary: runs the release jobs that pull images against the v1.0.7 digest. Removed before merge.
name: Release jobs against v1.0.7
on: pull_request
permissions: {}
jobs:
  same-binary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build v1.0.7 binaries
        run: |
          set -eu
          git fetch -q --depth 1 origin tag v1.0.7
          git worktree add -q ../v107 v1.0.7
          mkdir -p dist
          c=$(git rev-parse "v1.0.7^{commit}")
          for arch in amd64 arm64; do (cd ../v107 && scripts/build.sh v1.0.7 "$c" "$arch" "$GITHUB_WORKSPACE/dist/healthlog-push_v1.0.7_linux_${arch}"); done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: scripts/compare-image-binaries.sh ghcr.io/mbombeck/healthlog-push@sha256:1173f2c44f9e9f0121cf3a33106aa9c2f0fa435f35273c4bebff4c6dd461332a v1.0.7 dist
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      packages: read
    steps:
      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GRYPE_PLATFORM: linux/${{ matrix.arch }}
        with:
          image: ghcr.io/mbombeck/healthlog-push@sha256:1173f2c44f9e9f0121cf3a33106aa9c2f0fa435f35273c4bebff4c6dd461332a
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table
