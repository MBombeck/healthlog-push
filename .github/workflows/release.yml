name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mbombeck/healthlog-push

jobs:
  image:
    name: Image, signature, SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The release environment accepts only v* tags. Only this job names it; every other job needs this one.
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate tag
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi
      # No QEMU: the Dockerfile cross-compiles on $BUILDPLATFORM. BuildKit is pinned by digest because it
      # runs inside the job that holds id-token and packages write.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  sbom:
    name: SBOM (no signing rights)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 7

  # The pushed image, by digest, scanned with Grype. A HIGH or CRITICAL finding that has a fix stops the
  # GitHub release; the image is already in the registry, so fix and tag again.
  scan:
    name: Image scan (Grype)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    steps:
      - name: Scan image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_REGISTRY_AUTH_AUTHORITY: ghcr.io
          GRYPE_REGISTRY_AUTH_USERNAME: ${{ github.actor }}
          GRYPE_REGISTRY_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
          output-format: table

  attest-sbom:
    name: Attest SBOM
    needs: [image, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest SBOM
        env:
          REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

  # SLSA v1 build provenance, signed in the reusable workflow provenance.yml: its path, not release.yml, is
  # the certificate identity, so the build job cannot produce a provenance that verifies. The bundle goes
  # into the registry's referrers next to the signature and the SBOM, where a current cosign finds it with
  # no format flag (the SLSA generator's legacy `.att` tag needed `--new-bundle-format=false`).
  provenance:
    name: SLSA provenance
    needs: image
    permissions:
      id-token: write
      attestations: write
      packages: write
    uses: ./.github/workflows/provenance.yml
    with:
      image: ${{ needs.image.outputs.image }}
      digest: ${{ needs.image.outputs.digest }}

  # The release binaries and one SPDX SBOM for each, built in a job that can neither sign nor write to the
  # release. syft reads each SBOM from the finished binary, so it lists the modules and the Go version that
  # were compiled in. The syft version is the one fixed by the pinned action.
  binaries:
    name: Binaries and their SBOMs (no signing rights)
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # The same recipe as the Dockerfile, so each binary here is the file in the image (job same-binary).
      - name: Build binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            scripts/build.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" "$arch" "dist/healthlog-push_${GITHUB_REF_NAME}_linux_${arch}"
          done
      - name: SBOM of the amd64 binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/healthlog-push_${{ github.ref_name }}_linux_amd64
          format: spdx-json
          output-file: dist/healthlog-push_${{ github.ref_name }}_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: SBOM of the arm64 binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/healthlog-push_${{ github.ref_name }}_linux_arm64
          format: spdx-json
          output-file: dist/healthlog-push_${{ github.ref_name }}_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Each SBOM carries the hash of its binary and the modules in it
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            bin="healthlog-push_${GITHUB_REF_NAME}_linux_${arch}"
            jq -e --arg sum "$(sha256sum "dist/$bin" | cut -d' ' -f1)" '
              .spdxVersion == "SPDX-2.3"
              and any(.packages[]; .name == "go.etcd.io/bbolt")
              and any(.packages[]; .name == "stdlib")
              and any(.files[]; any(.checksums[]; .checksumValue == $sum))
            ' "dist/$bin.spdx.json" > /dev/null \
              || { echo "::error::dist/$bin.spdx.json does not describe $bin"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The binary in each platform image of the pushed digest must be the release binary of that platform,
  # byte for byte; otherwise SHA256SUMS would not describe what runs, and no GitHub release is created.
  same-binary:
    name: Image binary equals release binary
    needs: [image, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare
        env:
          REF: ${{ needs.image.outputs.image }}@${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/$arch" "$REF" > /dev/null
            id=$(docker create --platform "linux/$arch" "$REF")
            docker cp -q "$id:/healthlog-push" "image_$arch"
            docker rm "$id" > /dev/null
            want=$(sha256sum "dist/healthlog-push_${GITHUB_REF_NAME}_linux_${arch}" | cut -d' ' -f1)
            got=$(sha256sum "image_$arch" | cut -d' ' -f1)
            echo "linux/$arch image $got release $want" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$got" != "$want" ]; then
              echo "::error::linux/$arch: the binary in the image differs from the release binary"
              exit 1
            fi
          done

  github-release:
    name: Checksums, signature and GitHub release
    needs: [image, scan, binaries, same-binary, provenance, attest-sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # SHA256SUMS lists the two binaries and their two SBOMs, so the signature on it covers all four.
      - name: Checksums
        run: |
          set -euo pipefail
          test "$(find dist -type f | wc -l)" -eq 4
          (cd dist && sha256sum healthlog-push_* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Hash release files for the binary provenance
        id: hashes
        run: |
          set -euo pipefail
          echo "hashes=$(cd dist && sha256sum healthlog-push_* SHA256SUMS | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / {
              if (found) exit
              line = $0
              gsub(/[][]/, "", line)
              split(line, parts, " ")
              h = parts[2]
              sub(/^v/, "", h)
              if (h == v) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo
            echo "Image: \`${IMAGE}:${GITHUB_REF_NAME}\`"
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*

  # SLSA v1.0 provenance for the release binaries, their SBOMs and SHA256SUMS, uploaded to the release as
  # healthlog-push_vX.Y.Z.intoto.jsonl. The generator is a reusable workflow that must be referenced by its
  # full release tag: slsa-verifier checks the builder ref, and a commit SHA there makes the generator fail
  # (slsa-framework/slsa-verifier#12). v2.1.0 is commit f7dd8c54c2067bafc12ca7a55595d5ee9b75204a. The image
  # provenance above is unchanged and remains what the deployment role verifies.
  binary-provenance:
    name: Binary provenance
    needs: [github-release]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.github-release.outputs.hashes }}
      provenance-name: healthlog-push_${{ github.ref_name }}.intoto.jsonl
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}
