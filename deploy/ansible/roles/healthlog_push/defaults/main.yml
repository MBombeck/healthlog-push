---
# ---------------------------------------------------------------- release ---
# Image pinned by digest. A tag is not accepted.
healthlog_push_image: ""
# Git tag the image was released from (vX.Y.Z). Part of the signing identity.
healthlog_push_release_tag: ""
# Source repository whose release workflow signs the image.
healthlog_push_source_repo: MBombeck/healthlog-push
healthlog_push_oidc_issuer: https://token.actions.githubusercontent.com
healthlog_push_signing_identity: >-
  https://github.com/{{ healthlog_push_source_repo }}/.github/workflows/release.yml@refs/tags/{{ healthlog_push_release_tag }}
# The release workflow's reusable provenance workflow at the same tag (SLSA v1, Sigstore bundle).
healthlog_push_provenance_identity: >-
  https://github.com/{{ healthlog_push_source_repo }}/.github/workflows/provenance.yml@refs/tags/{{ healthlog_push_release_tag }}

# ----------------------------------------------------------------- cosign ---
# Pinned cosign release and the SHA-256 of cosign-linux-<arch>. The values are those of the release's
# binaries, each checked with `cosign verify-blob` against its .sigstore.json bundle (identity
# keyless@projectsigstore.iam.gserviceaccount.com, issuer https://accounts.google.com). cosign 3 reads the
# signature and the attestations in the Sigstore bundle format the release workflow writes.
healthlog_push_cosign_version: v3.1.4
healthlog_push_cosign_sha256:
  amd64: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  arm64: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2
healthlog_push_cosign_path: /usr/local/bin/cosign

# ---------------------------------------------------------------- runtime ---
healthlog_push_root: /srv/healthlog-push
healthlog_push_config_dir: /etc/healthlog-push
healthlog_push_project: healthlog-push
# The compose file shipped in this repository is the only source.
healthlog_push_compose_src: "{{ playbook_dir }}/../compose/compose.yaml"
healthlog_push_compose_journald_src: "{{ playbook_dir }}/../compose/compose.journald.yaml"
# Log driver of the containers: json-file (three files of 10 MB each per container, as compose.yaml sets) or
# journald (the host's systemd journal, kept as long as the host's journald keeps it; the relay's alert lines
# get priority err). journald adds compose.journald.yaml through COMPOSE_FILE in .env.
healthlog_push_log_driver: json-file

healthlog_push_public_host: push.example.org
healthlog_push_listen: ":8443"
healthlog_push_tls_mode: acme
healthlog_push_acme_directory: https://acme-v02.api.letsencrypt.org/directory
healthlog_push_acme_email: ""
healthlog_push_apns_topic: ""
healthlog_push_apns_key_id: ""
healthlog_push_apns_team_id: ""
# Oldest HealthLog server version the relay accepts (for example 1.49.0); empty accepts all.
healthlog_push_min_client_version: ""
# Registration mode of a new store (open, invite, closed). The relay applies it before it accepts the first
# request; a mode stored later with `admin registration` wins. Opening registration is a deliberate step.
healthlog_push_registration_mode: invite
# Public day aggregates at /stats (docs/api.md). Nothing is shown while fewer than three servers are registered.
healthlog_push_public_stats: false
# AppArmor profile per container. docker-default is what Docker applies anyway. To confine the containers
# further, set healthlog-push-relay and healthlog-push-signer and either let the role install the profiles
# of this release from deploy/apparmor/ (healthlog_push_apparmor_install) or load them yourself. The role
# refuses to start with a profile the kernel has not loaded in enforce mode.
healthlog_push_apparmor_relay: docker-default
healthlog_push_apparmor_signer: docker-default
# Only used with healthlog_push_wallet_enabled. The wallet and relay profiles name each other as the only peers
# on the sockets in /run/wallet: set healthlog-push-wallet together with healthlog-push-relay, or neither.
healthlog_push_apparmor_wallet: docker-default
healthlog_push_apparmor_install: false
healthlog_push_apparmor_src: "{{ playbook_dir }}/../apparmor"

healthlog_push_relay_uid: 65532
healthlog_push_signer_uid: 65533
healthlog_push_wallet_uid: 65534
healthlog_push_gid: 65530

# ----------------------------------------------------------------- wallet ---
# Apple Wallet pass signing (docs/self-hosting.md, "Wallet passes"). true writes pass.key and pass.crt to
# secrets/wallet, starts the wallet process (compose profile wallet) and sets HLP_WALLET_DIR for the relay;
# false stops and removes the wallet container and deletes secrets/wallet. The identifiers must equal the
# certificate's UID and OU.
healthlog_push_wallet_enabled: false
healthlog_push_wallet_pass_type_id: ""
healthlog_push_wallet_team_id: ""

# ---------------------------------------------------------------- secrets ---
# Supplied from your secret store at run time (for example through a lookup
# plugin or an encrypted vars file). Never commit values. Every task that
# touches them runs with no_log.
#   relay_id_key, token_mac_key, acme_account_key: file contents as written by
#     `healthlog-push keygen relay-id|token-mac|acme-account`.
#   token_mac_key_previous: optional, only during a MAC key rotation.
#   apns_key_p8_b64: the APNs .p8 file, base64 encoded.
#   wallet_pass_key_pem, wallet_pass_cert_pem: the pass key and certificate as PEM text, only with
#     healthlog_push_wallet_enabled.
healthlog_push_secret_relay_id_key: ""
healthlog_push_secret_token_mac_key: ""
healthlog_push_secret_token_mac_key_previous: ""
healthlog_push_secret_acme_account_key: ""
healthlog_push_secret_apns_key_p8_b64: ""
healthlog_push_secret_wallet_pass_key_pem: ""
healthlog_push_secret_wallet_pass_cert_pem: ""

# ----------------------------------------------------------------- deploy ---
# false: verify, write files, render .env and pull, but do not start the
# containers (used when preparing a new host, see docs/migration.md).
healthlog_push_start: true
healthlog_push_health_retries: 30
healthlog_push_health_delay: 5

# --------------------------------------------------------------- optional ---
# Path to a task file (on the control node) included after a successful
# deploy, for example to configure a log shipper. See examples/log-shipper.md.
healthlog_push_log_shipping_tasks: ""

# Belt-and-braces export. The relay writes the export daily by itself.
healthlog_push_export_timer_enabled: false
healthlog_push_export_timer_oncalendar: "*-*-* 03:17:00"
