---
- name: Check the image reference and release tag
  ansible.builtin.assert:
    that:
      - healthlog_push_image is match('^ghcr[.]io/.+@sha256:[0-9a-f]{64}$')
      - healthlog_push_release_tag is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
    fail_msg: >-
      healthlog_push_image must be ghcr.io/<owner>/<name>@sha256:<64 hex>
      (a tag alone is refused) and healthlog_push_release_tag must be vX.Y.Z.
    quiet: true

- name: Check required settings
  ansible.builtin.assert:
    that:
      - healthlog_push_public_host | length > 0
      - healthlog_push_apns_topic | length > 0
      - healthlog_push_apns_key_id | length > 0
      - healthlog_push_apns_team_id | length > 0
      - healthlog_push_cosign_version is match('^v[0-9]+[.][0-9]+[.][0-9]+$')
      - healthlog_push_cosign_sha256[healthlog_push_arch] | default('') is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Set public host, APNs topic, key id and team id, a pinned cosign version
      and the cosign SHA-256 for {{ healthlog_push_arch }}.
    quiet: true
  vars:
    healthlog_push_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Check that every secret is present (values are not shown)
  ansible.builtin.assert:
    that:
      - healthlog_push_secret_relay_id_key | length > 0
      - healthlog_push_secret_token_mac_key | length > 0
      - healthlog_push_secret_acme_account_key | length > 0
      - healthlog_push_secret_apns_key_p8_b64 | length > 0
    fail_msg: One or more secrets are empty. Supply them from your secret store.
    quiet: true
  no_log: true

- name: Check the registration mode and the AppArmor profile names
  ansible.builtin.assert:
    that:
      - healthlog_push_registration_mode in ['open', 'invite', 'closed']
      - healthlog_push_apparmor_relay is match('^[a-z0-9][a-z0-9._-]*$')
      - healthlog_push_apparmor_signer is match('^[a-z0-9][a-z0-9._-]*$')
    fail_msg: >-
      healthlog_push_registration_mode must be open, invite or closed; the AppArmor
      profile names must be plain profile names.
    quiet: true

- name: Read the loaded AppArmor profiles
  when: >-
    healthlog_push_apparmor_relay not in ['docker-default', 'unconfined']
    or healthlog_push_apparmor_signer not in ['docker-default', 'unconfined']
  block:
    - name: Read /sys/kernel/security/apparmor/profiles
      ansible.builtin.slurp:
        src: /sys/kernel/security/apparmor/profiles
      register: healthlog_push_apparmor_loaded

    - name: Check that the named profiles are loaded in enforce mode
      ansible.builtin.assert:
        that:
          - >-
            (healthlog_push_apparmor_relay ~ ' (enforce)') in healthlog_push_apparmor_profiles
            or healthlog_push_apparmor_relay in ['docker-default', 'unconfined']
          - >-
            (healthlog_push_apparmor_signer ~ ' (enforce)') in healthlog_push_apparmor_profiles
            or healthlog_push_apparmor_signer in ['docker-default', 'unconfined']
        fail_msg: >-
          The AppArmor profiles {{ healthlog_push_apparmor_relay }} and {{ healthlog_push_apparmor_signer }}
          must be loaded in enforce mode before the deploy (apparmor_parser -r), or set docker-default.
        quiet: true
      vars:
        healthlog_push_apparmor_profiles: "{{ (healthlog_push_apparmor_loaded.content | b64decode).splitlines() }}"
