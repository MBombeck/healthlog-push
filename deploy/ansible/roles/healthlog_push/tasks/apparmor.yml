---
# Optional: install the profiles shipped with this release, then check that the named profiles are loaded in
# enforce mode. A profile name the kernel does not know makes `docker compose up` fail, so this runs before
# compose is touched.
- name: Install the AppArmor profiles of this release
  when: healthlog_push_apparmor_install | bool
  block:
    - name: Copy the profiles to /etc/apparmor.d
      ansible.builtin.copy:
        src: "{{ healthlog_push_apparmor_src }}/{{ item }}"
        dest: "/etc/apparmor.d/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: >-
        {{ ['healthlog-push-relay', 'healthlog-push-signer']
           + (['healthlog-push-wallet'] if healthlog_push_wallet_enabled | bool else []) }}
      register: healthlog_push_apparmor_files

    - name: Load changed profiles in enforce mode  # noqa: no-handler
      ansible.builtin.command:
        argv: [apparmor_parser, -r, -W, "/etc/apparmor.d/{{ item.item }}"]
      loop: "{{ healthlog_push_apparmor_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item is changed
      changed_when: true

- name: Check the named AppArmor profiles
  when: >-
    healthlog_push_apparmor_relay not in ['docker-default', 'unconfined']
    or healthlog_push_apparmor_signer not in ['docker-default', 'unconfined']
    or (healthlog_push_wallet_enabled | bool
        and healthlog_push_apparmor_wallet not in ['docker-default', 'unconfined'])
  block:
    - name: Read /sys/kernel/security/apparmor/profiles
      ansible.builtin.slurp:
        src: /sys/kernel/security/apparmor/profiles
      register: healthlog_push_apparmor_loaded

    - name: Check that the named profiles are loaded in enforce mode
      ansible.builtin.assert:
        that:
          - >-
            (healthlog_push_apparmor_relay ~ ' (enforce)') in healthlog_push_apparmor_profiles
            or healthlog_push_apparmor_relay in ['docker-default', 'unconfined']
          - >-
            (healthlog_push_apparmor_signer ~ ' (enforce)') in healthlog_push_apparmor_profiles
            or healthlog_push_apparmor_signer in ['docker-default', 'unconfined']
          - >-
            (healthlog_push_apparmor_wallet ~ ' (enforce)') in healthlog_push_apparmor_profiles
            or healthlog_push_apparmor_wallet in ['docker-default', 'unconfined']
            or not (healthlog_push_wallet_enabled | bool)
        fail_msg: >-
          The AppArmor profiles {{ healthlog_push_apparmor_relay }} and {{ healthlog_push_apparmor_signer }}
          (and {{ healthlog_push_apparmor_wallet }} with Wallet on) must be loaded in enforce mode
          (healthlog_push_apparmor_install: true, or apparmor_parser -r), or set docker-default.
        quiet: true
      vars:
        healthlog_push_apparmor_profiles: "{{ (healthlog_push_apparmor_loaded.content | b64decode).splitlines() }}"
