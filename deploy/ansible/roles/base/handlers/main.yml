---
# Ubuntu 24.04 starts sshd through ssh.socket, generated from sshd_config.
# Restarting the socket picks up Port and ListenAddress changes.
- name: Restart ssh
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop:
    - ssh.socket
    - ssh.service

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reexec systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    state: restarted
