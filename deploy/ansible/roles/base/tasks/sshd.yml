---
# Drop-ins are read in lexical order and the first value wins, so 00- beats
# any image default such as 50-cloud-init.conf.
- name: Write the sshd hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-healthlog-push.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Check the complete sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
