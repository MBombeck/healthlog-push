---
- name: Write the chrony configuration
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Restart chrony

- name: Enable chrony
  ansible.builtin.systemd_service:
    name: chrony.service
    enabled: true
    state: started
