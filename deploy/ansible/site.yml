---
# healthlog-push host: hardening, firewall, Docker, relay deploy.
#
#   ansible-playbook -i inventory.yml site.yml
#
# Tags: base, firewall, docker, healthlog_push. A release update only needs
# `--tags healthlog_push -e healthlog_push_image=... -e healthlog_push_release_tag=...`.

- name: Provision and deploy healthlog-push
  hosts: healthlog_push
  become: true
  gather_facts: true
  roles:
    - role: base
      tags: [base]
    - role: firewall
      tags: [firewall]
    - role: docker
      tags: [docker]
    - role: healthlog_push
      tags: [healthlog_push]
